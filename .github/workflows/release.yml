name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # In this workflow, not one triggered by the tag: a tag pushed with the
  # workflow's own token does not start other workflows.
  publish:
    name: Publish to nuget.org
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet paket restore
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test tests/Fansi.Tests -c Release --no-build
      - run: dotnet pack src/Fansi -c Release --no-build -o artifacts

      # The release PR writes the version into Fansi.fsproj. A mismatch means the
      # tag points at a commit without it, and nothing should be pushed.
      - name: Check the package version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: test -f "artifacts/Fansi.Tui.${VERSION}.nupkg"

      # Before the login, so a failed push can be redone by hand from this file.
      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber

      # The key lasts one hour, so log in right before pushing.
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
